<!DOCTYPE html><html lang="pt-BR"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Máquina Meio de Funil - Smartadv & Gringa</title>    <style>        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; padding: 40px 20px; text-align: center; margin: 0; }        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); max-width: 550px; margin: auto; text-align: left; }        h2 { text-align: center; color: #1e3a8a; margin-top: 0; font-size: 24px; }        label { font-weight: 600; font-size: 14px; color: #4b5563; display: block; margin-top: 15px; }        input, select, button { width: 100%; padding: 14px; margin: 8px 0 15px 0; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; }        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }        button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }        button:hover { background: #1d4ed8; }        #output { text-align: left; background: #fff; padding: 25px; border-radius: 12px; max-width: 800px; margin: 30px auto; white-space: pre-wrap; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-left: 5px solid #2563eb; line-height: 1.6; }    </style></head><body>    <div class="card">        <h2> Inversor de Funil Profissional</h2>                <label for="produto">Nome do Produto Smartadv:</label>        <input type="text" id="produto" placeholder="Ex: Hondrostrong, Steperol, Wintex">                <label for="mercado">Mercado e Idioma Alvo:</label>        <select id="mercado">            <option value="US"> Estados Unidos (Inglês)</option>            <option value="IT"> Itália (Italiano) - Forte na Smartadv</option>            <option value="ES"> Espanha (Espanhol) - Forte na Smartadv</option>            <option value="DE"> Alemanha (Alemão)</option>            <option value="FR"> França (Francês)</option>        </select>                <button onclick="gerarEstrategia()"> Analisar e Criar Campanha</button>    </div>        <div id="output"></div>
    <script>        async function gerarEstrategia() {            const produto = document.getElementById('produto').value.trim();            const mercadoSelect = document.getElementById('mercado').value;            const output = document.getElementById('output');                        if (!produto) {                alert("Por favor, digite o nome do produto.");                return;            }                        let lang = "en";            if(mercadoSelect === "DE") lang = "de";            if(mercadoSelect === "IT") lang = "it";            if(mercadoSelect === "FR") lang = "fr";            if(mercadoSelect === "ES") lang = "es";
            output.style.display = "block";            output.innerText = " Varrendo mercado e analisando dores ocultas...\n Processando regras de compliance e estruturando anúncios RSA em tempo real. Aguarde.";
            try {                const res = await fetch('/api/analisar', {                    method: 'POST',                    headers: { 'Content-Type': 'application/json' },                    body: JSON.stringify({ product_name: produto, market: mercadoSelect, language: lang })                });                const data = await res.json();                output.innerText = data.resultado || data.error || "Ocorreu um erro inesperado.";            } catch (err) {                output.innerText = "Erro ao conectar com o servidor: " + err.message;            }        }    </script></body></html>
